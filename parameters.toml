"2.03" = "PATRIMONIO_LIQUIDO"
"6.01" = "FCO"
"6.02" = "FCI"
"6.03" = "FCF"

# ============================================================
# Classificação de Setores por Palavras-Chave
# ============================================================

[setores]
financeiro = ["BANCO", "ARRENDAMENTO", "FACTORING", "CREDITO", "SECURITIZACAO"]
seguradora = ["SEGURO", "SEGURADORA", "PREVIDENCIA", "CAPITALIZACAO"]
