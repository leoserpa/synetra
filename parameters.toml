# ============================================================
# Synetra - Arquivo de Configuração Central
# ============================================================

[urls]
dfp_pattern = "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/DFP/DADOS/dfp_cia_aberta_{year}.zip"
fre_pattern = "http://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/FRE/DADOS/fre_cia_aberta_{year}.zip"
cadastro = "http://dados.cvm.gov.br/dados/CIA_ABERTA/CAD/DADOS/cad_cia_aberta.csv"
fundamentus = "https://www.fundamentus.com.br/detalhes.php"

[pipeline]
doc_types = ["DRE", "BPA", "BPP", "DFC_MI", "DFC_MD"]
years_start = 2010
years_end = 2026
max_workers = 5

[fuzzy_match]
threshold = 85

# ============================================================
# Mapeamento de Contas Contábeis por Setor
# ============================================================

[contas.industrial]
"1" = "ATIVO_TOTAL"
"3.01" = "RECEITA_LIQUIDA"
"3.03" = "RESULTADO_BRUTO"
"3.05" = "EBIT"
"3.11" = "LUCRO_LIQUIDO"
"3.09" = "LUCRO_LIQUIDO_BCO"
"1.01" = "ATIVO_CIRCULANTE"
"2.01" = "PASSIVO_CIRCULANTE"
"2.03" = "PATRIMONIO_LIQUIDO"
"1.01.01" = "CAIXA_EQUIVALENTES"
"1.01.02" = "CAIXA_EQUIVALENTES"
"2.01.04" = "DIVIDA_CP"
"2.02.01" = "DIVIDA_LP"
"6.01" = "FCO"
"6.02" = "FCI"
"6.03" = "FCF"

[contas.financeiro]
"1" = "ATIVO_TOTAL"
"1.01" = "ATIVO_CIRCULANTE"
"1.01.01" = "CAIXA_EQUIVALENTES"
"2.01" = "PASSIVO_CIRCULANTE"
"3.01" = "RECEITA_LIQUIDA"
"3.03" = "RESULTADO_BRUTO"
"3.05" = "EBIT"
"3.11" = "LUCRO_LIQUIDO"
"3.09" = "LUCRO_LIQUIDO_BCO"
"2.08" = "PATRIMONIO_LIQUIDO"
"2.07" = "PATRIMONIO_LIQUIDO"
"6.01" = "FCO"
"6.02" = "FCI"
"6.03" = "FCF"

[contas.seguradora]
"1" = "ATIVO_TOTAL"
"1.01" = "ATIVO_CIRCULANTE"
"1.01.01" = "CAIXA_EQUIVALENTES"
"1.01.02" = "APLICACOES_CP"
"1.02.01.01" = "APLICACOES_LP"
"2.01" = "PASSIVO_CIRCULANTE"
"3.01" = "RECEITA_LIQUIDA"
"3.01.01" = "RECEITA_LIQUIDA"
"3.03" = "RESULTADO_BRUTO"
