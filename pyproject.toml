[project]
name = "synetra"
version = "1.1.0"
description = "Pipeline ETL para Análise Fundamentalista de Dados da CVM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "polars>=1.40.1",
    "pydantic>=2.13.3",
    "yfinance>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.12",
    "mypy>=1.13.0",
    "hypothesis>=6.122.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.3",
]

# --- Ruff (linter e formatter) ---
[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".venv",
    ".synetra_cache",
    "scratch",
    ".ruff_cache",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (imports não usados, etc)
    "I",    # isort (ordem de imports)
    "UP",   # pyupgrade (sintaxe moderna)
    "B",    # flake8-bugbear (bugs comuns)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (deixamos o Polars respirar)
    "B008",  # função em default arg (pl.lit é ok)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]  # asserts em testes são ok
"scratch/*" = ["F401", "E402"]  # scripts experimentais

# --- Mypy (type checker) ---
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
exclude = [
    "scratch/",
    "tests/",
]

# --- Bandit (scanner de segurança) ---
[tool.bandit]
exclude_dirs = [".venv", "tests", "scratch", ".synetra_cache"]
skips = ["B101"]  # Permite asserts em código de produção

# --- Pytest ---
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "asyncio: mark a test as an asyncio coroutine",
]
asyncio_mode = "auto"

# --- Coverage ---
[tool.coverage.run]
source = ["synetra"]
omit = [
    "*/tests/*",
    "*/scratch/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 1

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
