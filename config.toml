# Synetra — configuração do pipeline.

[urls]
dfp_pattern = "https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/DFP/DADOS/dfp_cia_aberta_{year}.zip"
fre_pattern = "http://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/FRE/DADOS/fre_cia_aberta_{year}.zip"
cadastro = "http://dados.cvm.gov.br/dados/CIA_ABERTA/CAD/DADOS/cad_cia_aberta.csv"

[pipeline]
doc_types = ["DRE", "BPA", "BPP", "DFC_MI", "DFC_MD"]
years_start = 2010
years_end = 2026
max_workers = 5
force_refresh = false

# --- Integração com Yahoo Finance ---

# Baixa cotações históricas da B3 e anexa ao CSV final como
# PRECO_FIM_ANO, PRECO_MEDIO_ANO e VOLUME_MEDIO. Desabilitado roda
# só com dados contábeis da CVM.

[market]
enabled = true
cache_max_age_days = 7
batch_size = 100


