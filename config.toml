# --- Classificação setorial por palavras-chave ---

[setores]
financeiro = ["BANCO", "ARRENDAMENTO", "FACTORING", "CREDITO", "SECURITIZACAO"]
seguradora = ["SEGURO", "SEGURADORA", "PREVIDENCIA", "CAPITALIZACAO"]

# --- Regex para detecção de contas especiais na DFC ---

[regex]
depreciacao = "DEPRECIA|AMORTIZA"
capex = "AQUISIC|ADIC|COMPRA"
capex_tipo = "IMOBILIZADO|INTANGIVEL"
dividendos = "DIVIDENDO|JURO SOBRE CAPITAL|JUROS SOBRE CAPITAL|JURO S CAPITAL|JUROS S CAPITAL|JCP"
ebit_seguradora = "RESULTADO ANTES DO RESULTADO FINANCEIRO|RESULTADO ANTES DAS RECEITAS"
