name: CI

# Pipeline de qualidade: lint, type check, testes, security scan, audit de
# dependências. Cada job roda em paralelo; o gate final falha se qualquer
# etapa anterior falhar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      - name: Sincronizar dependências
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check synetra/ tests/ main.py

  typecheck:
    name: Type check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      - name: Sincronizar dependências
        run: uv sync --extra dev
      - name: Mypy strict
        run: uv run mypy synetra/ --ignore-missing-imports

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      - name: Sincronizar dependências
        run: uv sync --extra dev
      - name: Pytest + coverage
        run: |
          uv run pytest tests/ -v --tb=short \
            --cov=synetra \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      - name: Sincronizar dependências
        run: uv sync --extra dev
      - name: Bandit
        run: uv run bandit -r synetra/ -c pyproject.toml

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true
      - name: Sincronizar dependências
        run: uv sync --extra dev
      - name: pip-audit
        run: uv run pip-audit

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security, audit]
    if: always()
    steps:
      - name: Verificar resultado dos jobs anteriores
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint falhou"; exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "Typecheck falhou"; exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Testes falharam"; exit 1
          fi
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "Security scan falhou"; exit 1
          fi
          if [[ "${{ needs.audit.result }}" != "success" ]]; then
            echo "Dependency audit falhou"; exit 1
          fi
          echo "Todos os jobs de qualidade passaram"
